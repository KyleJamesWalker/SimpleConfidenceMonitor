name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: JavaScript syntax check
        run: for f in web/*.js; do node --check "$f"; done

      - name: JavaScript tests
        run: node --test web/*.test.mjs

  matrix-sync:
    name: matrix sync (ci ↔ release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the ci.yml and release.yml build matrices
        run: python3 .github/scripts/check_matrix_sync.py

  build:
    name: build · ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: simple-confidence-monitor-x86_64-linux
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: simple-confidence-monitor-aarch64-linux
            zig: true
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: simple-confidence-monitor-aarch64-macos
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: simple-confidence-monitor-x86_64-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: simple-confidence-monitor-x86_64-windows
            ext: .exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: simple-confidence-monitor-aarch64-windows
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.asset }}

      - name: Install Zig
        if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Install cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build (zigbuild)
        if: matrix.zig
        run: cargo zigbuild --release --target ${{ matrix.target }} --locked

      - name: Build (cargo)
        if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Stage artifact
        shell: bash
        run: cp "target/${{ matrix.target }}/release/simple-confidence-monitor${{ matrix.ext }}" "${{ matrix.asset }}${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}${{ matrix.ext }}
          if-no-files-found: error

  docker:
    name: Build & Publish Docker Image (PR/Edge)
    needs: [build, test]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: simple-confidence-monitor-x86_64-linux
          path: dist

      - name: Download aarch64 binary
        uses: actions/download-artifact@v4
        with:
          name: simple-confidence-monitor-aarch64-linux
          path: dist

      - name: Stage binaries for the Docker build
        run: |
          mv dist/simple-confidence-monitor-x86_64-linux dist/simple-confidence-monitor-amd64
          mv dist/simple-confidence-monitor-aarch64-linux dist/simple-confidence-monitor-arm64

      - name: Downcase repository name for GHCR tag compat
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tags=ghcr.io/${{ env.REPO_LOWER }}:pr-${{ github.event.pull_request.number }},ghcr.io/${{ env.REPO_LOWER }}:sha-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "tags=ghcr.io/${{ env.REPO_LOWER }}:edge,ghcr.io/${{ env.REPO_LOWER }}:sha-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
